name: Link package
# dev/26.3 에 커밋이 푸시될 때마다 Link jar 를 빌드하고, link-api 를 GitHub Packages(Maven)에,
# Pterodactyl 서버 이미지를 GHCR 에 올린다.
on:
  push:
    branches: ['dev/26.3']
  workflow_dispatch:
concurrency:
  group: link-package-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # 기본 러너 메모리(7GB) 안에서 패치 적용/컴파일이 되도록 Gradle 힙을 줄인다
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: git config --global user.name Link-CI && git config --global user.email link-ci@localhost
      - run: bash gradlew applyAllPatches --console=plain
      - run: bash gradlew linkDist --console=plain
      - name: Publish link-api to GitHub Packages (Maven)
        run: bash gradlew :link-api:publishLinkApiPublicationToGitHubPackagesRepository --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA / owner
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: link-dist-${{ env.SHORT_SHA }}
          path: build/dist/*.jar
          if-no-files-found: error
      - run: cp build/dist/Link-26.3-dev.jar docker/link-server/server.jar
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/link-server
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/link-server:26.3
            ghcr.io/${{ env.OWNER }}/link-server:26.3-${{ env.SHORT_SHA }}
